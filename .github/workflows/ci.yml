name: CI

# Third-party actions are pinned to a commit SHA, never to a tag. A tag like `v7`
# is just a movable name as far as a runner is concerned: whoever can move it
# moves what this workflow executes, with this repository's permissions. The
# trailing comment on each `uses:` line records which version that SHA is, so
# updating an action is an edit of both halves rather than a silent drift.
#
# To bump one: `gh api repos/actions/<name>/git/ref/tags/v<N>` for the SHA, and
# `gh api repos/actions/<name>/commits/<sha>` for the version it corresponds to.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: Run tests with warnings as errors
        run: swift test -Xswiftc -warnings-as-errors

      - name: Build application bundle
        run: make app

      - name: Verify application signature
        run: codesign --verify --deep --strict --verbose=2 dist/PaneSpace.app

      # `codesign --verify` cannot see a bundle that verifies cleanly and still
      # dies at launch: hardened runtime without the right entitlement makes dyld
      # refuse to map Sparkle.framework, and every codesign check passes on it.
      # The check is a launch. See ADR 0011 §2b and §7b.
      - name: Launch the packaged bundle
        run: ./scripts/launch-smoke-test.sh

      - name: Upload development bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PaneSpace-development
          path: dist/PaneSpace.app
