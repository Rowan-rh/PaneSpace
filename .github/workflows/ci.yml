name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: Run tests with warnings as errors
        run: swift test -Xswiftc -warnings-as-errors

      - name: Build application bundle
        run: make app

      - name: Verify application signature
        run: codesign --verify --deep --strict --verbose=2 dist/PaneSpace.app

      # `codesign --verify` cannot see a bundle that verifies cleanly and still
      # dies at launch: hardened runtime without the right entitlement makes dyld
      # refuse to map Sparkle.framework, and every codesign check passes on it.
      # The check is a launch. See ADR 0011 §2b and §7b.
      - name: Launch the packaged bundle
        run: ./scripts/launch-smoke-test.sh

      - name: Upload development bundle
        uses: actions/upload-artifact@v7
        with:
          name: PaneSpace-development
          path: dist/PaneSpace.app
