name: Release

# Third-party actions are pinned to a commit SHA, never to a tag -- a tag like
# `v7` is a movable name as far as a runner is concerned, and two of the three
# actions below run with `contents: write`. The trailing comment on each `uses:`
# line records which version that SHA is, so updating an action is an edit of
# both halves rather than a silent drift.
#
# To bump one: `gh api repos/actions/<name>/git/ref/tags/v<N>` for the SHA, and
# `gh api repos/actions/<name>/commits/<sha>` for the version it corresponds to.

on:
  push:
    tags: ['v*']
  # Manual recovery only, and a strict replacement for "Re-run all jobs", which
  # GitHub stops offering 30 days after a run. Nothing triggers this automatically
  # and no new publish path is added: a dispatched run does exactly what the
  # corresponding event-driven run does, for a tag that already exists, and every
  # fact it needs is read back from the server rather than from an event payload
  # it would not have.
  #
  # Two inputs, because the two halves are guarded by mutually exclusive events
  # and must stay that way.
  #
  # `build` re-signs, re-packages and re-uploads the assets, and the `publish` job
  # follows it through `needs` -- so this is exactly what "Re-run all jobs" used to
  # do. It re-uploads with `--clobber`, meaning it REPLACES assets that are already
  # published. The consequence is sharper than "the files changed": if this version
  # is already in the appcast branch, the feed still carries the previous archive's
  # signature and length and every Sparkle client fails to verify until
  # publish-appcast catches up. So: never dispatch `build` for a version already in
  # the feed, and follow a `build` with `publish-appcast` immediately. See the
  # warning in docs/RELEASING.md.
  #
  # `publish-appcast` re-runs only the feed commit, which is the half whose failure
  # message tells you to re-run it and the half that has no other recovery path.
  workflow_dispatch:
    inputs:
      job:
        description: '补跑哪一半'
        type: choice
        required: true
        default: build
        options:
          - build
          - publish-appcast
      tag:
        description: '要补跑的 tag，例如 v0.2.0；必须与已存在的 Release 的 tag 完全一致'
        type: string
        required: true
  release:
    # Fires when a human publishes a draft, i.e. when the assets behind the
    # appcast's download URLs start answering anonymous requests. That is the
    # only moment the feed may be advanced; see the publish-appcast job.
    types: [published]

# Default is read-only. The two jobs that talk to GitHub Releases and to the
# `appcast` branch are widened, and neither of them ever sees the signing
# certificate or the Ed25519 private key.
permissions:
  contents: read

concurrency:
  # A single group for every release, deliberately without the ref in the name.
  # The `appcast` branch is read-modify-write: the build job reads the previous
  # feed, the publish-appcast job writes the new one. Two releases doing that
  # at once would let the second commit drop the first one's entry, and that
  # entry is the only record of a version that already shipped. With one group
  # they queue; `cancel-in-progress: false` makes the second wait rather than
  # kill the first mid-upload.
  group: release-appcast
  cancel-in-progress: false

jobs:
  build:
    # Only the tag push runs this half. Without the guard, publishing a draft
    # would re-run the whole build and then re-upload its assets with
    # --clobber onto a Release that is already public: a second signing run, and
    # already-published zip/sig files silently replaced by newly built ones
    # nobody has reviewed -- leaving the published feed pointing at a signature
    # and a length that no longer match the archive. The publish job inherits
    # this skip through `needs`.
    # `push` plus one manual recovery entry. The dispatch adds no new capability:
    # it re-runs this job for a tag that already has a run, which is what
    # "Re-run all jobs" did before GitHub stopped offering it after 30 days.
    # It carries the same hazard, which is why the entry is documented as one to
    # use only when this version is not yet in the feed.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.job == 'build')
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # The tag this run is about. `inputs.tag` is empty on every event-driven run,
      # so the expression below is the tag that was pushed; on a dispatched run it
      # is the tag the person typed, which `GITHUB_REF_NAME` cannot tell us (a
      # dispatch starts from whatever branch the workflow file was selected on).
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      # On a dispatched run the checkout has to follow the tag, not the branch the
      # workflow was selected on: the scripts that produce and verify the feed are
      # that tag's own, the same reason publish-appcast checks out the tag.
      #
      # `refs/tags/` is spelled out rather than passing the bare name because a bare
      # name also resolves to a branch of the same name, and a recovery run that
      # silently checked out some branch is the one thing that must not happen here.
      - name: Assert the tag exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # A push event is its own proof, so only a dispatched run is checked.
          if [[ -z "$TAG" ]]; then
            exit 0
          fi
          if ! git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" \
            "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "::error::refs/tags/$TAG does not exist on $GITHUB_REPOSITORY"
            echo "::error::A recovery run must name a tag that was already pushed. Left unchecked, gh release create would create it on the default branch from a typo."
            exit 1
          fi
          echo "refs/tags/$TAG exists"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Derive version from tag
        id: version
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          read -r version build_number < <(./scripts/version-from-tag.sh "$tag")
          # A tag containing "-" is a prerelease by the repository convention.
          if [[ "$tag" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "build=$build_number"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $version (build $build_number) from tag $tag"

      - name: Check signing secrets are configured
        env:
          CERT: ${{ secrets.PANESPACE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.PANESPACE_CERT_P12_PASSWORD }}
          ED_KEY: ${{ secrets.PANESPACE_ED25519_PRIVATE_KEY }}
          APPCAST_URL: ${{ secrets.PANESPACE_APPCAST_URL }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$CERT" ]] || missing+=(PANESPACE_CERT_P12_BASE64)
          [[ -n "$CERT_PASSWORD" ]] || missing+=(PANESPACE_CERT_P12_PASSWORD)
          [[ -n "$ED_KEY" ]] || missing+=(PANESPACE_ED25519_PRIVATE_KEY)
          # The feed URL is required, not optional: a build that ships SUPublicEDKey
          # but no reachable feed checks for updates forever and never finds one.
          # It is a secret rather than a constant because the carrier (a dedicated
          # branch, GitHub Pages, or an asset on a fixed tag) is a repository
          # decision -- see docs/adr/0011 decision 3.
          [[ -n "$APPCAST_URL" ]] || missing+=(PANESPACE_APPCAST_URL)
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing repository secret(s): ${missing[*]}"
            exit 1
          fi
          # Checked here as well as in build-app.sh: failing before the build
          # saves a signed artifact nobody can update.
          if [[ "$APPCAST_URL" != https://* ]]; then
            echo "::error::PANESPACE_APPCAST_URL must be an https URL; a release must not ship a plaintext feed"
            exit 1
          fi
          # A release that trusted a local feed would defeat the EdDSA
          # verification the rest of the build sets up, so the test-only switch is
          # refused outright here rather than left to a reviewer's eye.
          if [[ -n "${PANESPACE_APPCAST_ALLOW_LOCALHOST:-}" ]]; then
            echo "::error::PANESPACE_APPCAST_ALLOW_LOCALHOST must not be set in a release build"
            exit 1
          fi
          echo "All signing secrets are present"

      - name: Check committed Ed25519 public key
        id: publickey
        run: |
          set -euo pipefail
          key_file="scripts/update-public-ed25519.txt"
          if [[ ! -f "$key_file" ]]; then
            echo "::error::$key_file is missing; commit the release public key before tagging"
            exit 1
          fi
          key="$(tr -d '[:space:]' < "$key_file")"
          if [[ -z "$key" || "$key" == PLACEHOLDER* ]]; then
            echo "::error::$key_file still holds the placeholder; replace it with the real public key"
            exit 1
          fi
          if [[ ! "$key" =~ ^[A-Za-z0-9+/]{43}=$ ]]; then
            echo "::error::$key_file must hold a base64 32-byte Ed25519 public key"
            exit 1
          fi
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "Public key present and well-formed"

      - name: Show toolchain
        run: |
          sw_vers
          swift --version

      - name: Run tests with warnings as errors
        run: swift test -Xswiftc -warnings-as-errors

      - name: Import signing certificate into a temporary keychain
        id: keychain
        env:
          CERT: ${{ secrets.PANESPACE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.PANESPACE_CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          # Fixed path, not an output: the cleanup step must be able to remove
          # the keychain even when this step fails part-way through.
          keychain="$RUNNER_TEMP/panespace-signing.keychain-db"
          p12="$RUNNER_TEMP/panespace-signing.p12"
          cert="$RUNNER_TEMP/panespace-signing-cert.pem"
          umask 077
          # The runner is ephemeral, so a random per-run keychain password is
          # simpler and safer than storing another secret. Mask it before it can
          # reach any command's error output; it is never written to GITHUB_OUTPUT
          # because only this step needs it.
          password="$(openssl rand -base64 24 | tr -d '\n')"
          echo "::add-mask::$password"
          printf '%s' "$CERT" | base64 --decode > "$p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain"
          # The .p12 was exported with OpenSSL's -legacy algorithms, so OpenSSL 3
          # needs -legacy to read the certificate back out.
          P12_PASSWORD="$CERT_PASSWORD" openssl pkcs12 -legacy -in "$p12" \
            -passin env:P12_PASSWORD -nokeys -clcerts -out "$cert"
          rm -f "$p12"
          # A self-signed certificate is not trusted by default, so `find-identity`
          # reports 0 valid identities. It is addressed by SHA-1 rather than by
          # name below, because codesign accepts a hash and needs no trust
          # setting: verified locally, and it leaves no residue in the user
          # trust domain that a headless runner could not clean up.
          identity_hash="$(openssl x509 -in "$cert" -noout -fingerprint -sha1 \
            | sed -E 's/.*=//; s/://g')"
          rm -f "$cert"
          if [[ -z "$identity_hash" ]]; then
            echo "::error::Could not read the certificate SHA-1 fingerprint; the .p12 may not be the expected certificate"
            exit 1
          fi
          # Read into a variable before matching, for the reason given in f4847d0
          # for build-app.sh: under `set -o pipefail`, `security ... | grep -qF`
          # is a coin flip -- grep exits on the first match, `security` is still
          # writing and dies on SIGPIPE, and pipefail calls the whole pipeline
          # failed. CI's temporary keychain holds one certificate, whose listing
          # fits in the pipe buffer, so it does not bite there today; measured on
          # a probe keychain holding 70 certificates (84 KB of listing) the old
          # form reported "certificate missing" on 300 runs out of 300.
          keychain_certificates="$(security find-certificate -a -c "PaneSpace Self-Signed" -Z "$keychain" 2>/dev/null)"
          if [[ "$keychain_certificates" != *"$identity_hash"* ]]; then
            echo "::error::The imported certificate is not present in the temporary keychain"
            exit 1
          fi
          echo "Signing identity available (SHA-1 $identity_hash)"
          {
            echo "keychain=$keychain"
            echo "identity=$identity_hash"
          } >> "$GITHUB_OUTPUT"

      - name: Build and sign the application
        env:
          PANESPACE_VERSION: ${{ steps.version.outputs.version }}
          PANESPACE_BUILD: ${{ steps.version.outputs.build }}
          PANESPACE_SIGN_IDENTITY: ${{ steps.keychain.outputs.identity }}
          PANESPACE_SIGN_KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
          PANESPACE_ED_PUBLIC_KEY: ${{ steps.publickey.outputs.key }}
          PANESPACE_APPCAST_URL: ${{ secrets.PANESPACE_APPCAST_URL }}
        run: make app

      - name: Verify signature and print designated requirement
        run: |
          set -euo pipefail
          codesign --verify --strict --verbose=2 dist/PaneSpace.app
          echo "--- designated requirement ---"
          # This line must stay identical across releases: it is what keeps the
          # user's TCC folder grants alive across updates.
          codesign -d -r- dist/PaneSpace.app 2>/dev/null | tee requirement.txt
          if grep -q "cdhash" requirement.txt; then
            echo "::error::Designated requirement is cdhash-based; the signature would break on every update"
            exit 1
          fi
          codesign -dvvv dist/PaneSpace.app 2>&1 \
            | grep -E "^(Identifier|Authority|Signature|TeamIdentifier)=" || true

      # Same reason as in ci.yml, and it matters more here: this is the bundle
      # that gets zipped and published, so a build that verifies but cannot start
      # would ship. Verifying the signature proves nothing about launchability --
      # see ADR 0011 §2b (third row of the table) and §7b.
      - name: Launch the packaged bundle
        run: ./scripts/launch-smoke-test.sh

      - name: Package the archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          archive="PaneSpace-$VERSION-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/PaneSpace.app "dist/$archive"
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
          echo "architectures: $(lipo -archs dist/PaneSpace.app/Contents/MacOS/PaneSpace)"
          ls -la "dist/$archive" "dist/$archive.sha256"

      - name: Sign the archive and verify the signature
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PANESPACE_ED25519_PRIVATE_KEY: ${{ secrets.PANESPACE_ED25519_PRIVATE_KEY }}
          PUBLIC_KEY: ${{ steps.publickey.outputs.key }}
        run: |
          set -euo pipefail
          archive="dist/PaneSpace-$VERSION-macos-arm64.zip"
          # The private key is passed through the environment, never argv, so it
          # does not appear in the runner's process list.
          swift scripts/ed25519.swift sign "$archive" "$archive.sig"
          # Verify against the committed public key, so a release is never
          # published with a signature no installed PaneSpace could check.
          swift scripts/ed25519.swift verify "$archive" \
            "$(cat "$archive.sig")" "$PUBLIC_KEY"
          # A signature that still verified against a tampered archive would make
          # the .sig file meaningless; confirm that it does not.
          cp "$archive" "$archive.probe"
          printf 'X' | dd of="$archive.probe" bs=1 seek=1024 conv=notrunc 2>/dev/null
          if swift scripts/ed25519.swift verify "$archive.probe" \
            "$(cat "$archive.sig")" "$PUBLIC_KEY" 2>/dev/null; then
            echo "::error::Tampered archive still verified; the signature is not covering the file"
            exit 1
          fi
          rm -f "$archive.probe"
          echo "Signature rejects a tampered archive as expected"

      - name: Generate the signed appcast
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          REPO: ${{ github.repository }}
          APPCAST_BRANCH: appcast
          PANESPACE_ED25519_PRIVATE_KEY: ${{ secrets.PANESPACE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # The generator that ships with the pinned Sparkle release. SwiftPM
          # already verified this artifact against Package.resolved when it
          # resolved the dependency, and it is byte-identical to the framework the
          # app was linked against. Building the generator from the checkout
          # instead would compile the same source a second time, slowly, with
          # signing settings that have never run in CI.
          generator="$PWD/.build/artifacts/sparkle/Sparkle/bin/generate_appcast"
          if [[ ! -x "$generator" ]]; then
            echo "::error::generate_appcast is missing from the SwiftPM artifact bundle; the app build above must have resolved Sparkle"
            exit 1
          fi

          # Copy, never move: the zip has to stay at dist/ for the upload step and
          # for the publish job that re-verifies it. A move left dist/ without it
          # and `if-no-files-found: error` did not catch that, because the other
          # globs still matched.
          input=dist/appcast-input
          mkdir -p "$input"
          cp dist/PaneSpace-"$VERSION"-macos-arm64.zip "$input/"
          cp dist/PaneSpace-"$VERSION"-macos-arm64.zip.sig "$input/"

          # The previous appcast is an input, not a convenience: without it the
          # feed would contain this release alone, and a user on an older version
          # would get no upgrade path at all.
          #
          # It does NOT carry every historical entry forward, which is what an
          # earlier version of this comment claimed. `generate_appcast` defaults to
          # `--maximum-versions 3` and keeps the three newest versions *per branch*
          # (generate_appcast/Appcast.swift:145); a non-default channel branch that
          # the default channel has overtaken is cut down to a single entry
          # (Appcast.swift:150-165). Measured with the pinned 2.10.0 generator and
          # five signed archives:
          #
          #   5 archives, no previous appcast  -> 3 items, "Moved 2 old update
          #                                        files to old_updates"
          #   previous appcast (3 items) + only the new archive, i.e. exactly
          #   the layout below                      -> 3 items, the oldest of the
          #                                        three dropped: "Wrote 1 new
          #                                        update, ... and removed 1 old
          #                                        update"
          #
          # So the oldest entries age out of the feed as releases land. That is the
          # generator's default, not a PaneSpace decision, and `--maximum-versions 0`
          # would keep every entry instead -- unbounded feed growth being the reason
          # the default exists. Changing it is a product decision, not a bug fix.
          #
          # It is read from the `appcast` branch with git rather than from the raw
          # URL the app is pointed at. raw.githubusercontent.com is CDN-cached for
          # roughly five minutes, so a fetch right after a release can return the
          # previous-but-one appcast and silently drop the newest entry from the
          # feed. Git reads the committed object.
          #
          # Only a genuinely missing branch or file counts as a first release.
          # `git ls-remote --exit-code` distinguishes three outcomes and the
          # difference matters: 0 = the branch exists, 2 = no matching ref,
          # anything else = the remote could not be reached or refused us.
          # Collapsing the last case into "first release" would wipe the feed's
          # history and then publish it, which is far worse than a failed job.
          remote="https://github.com/$REPO.git"
          branch_state=0
          git ls-remote --exit-code --heads "$remote" "$APPCAST_BRANCH" >/dev/null 2>&1 || branch_state=$?
          # The commit this feed is built on. The feed is generated here but
          # committed days later, by another workflow run, from this snapshot:
          # if the branch moved in between, committing the snapshot would drop
          # whatever landed in between. The SHA travels to that job as a
          # release asset so it can tell "still based on the same commit" from
          # "too old to publish". `none` means there was no branch to be based
          # on, which is the first release and cannot go stale.
          appcast_base=none
          case "$branch_state" in
            0)
              git fetch --depth 1 "$remote" "$APPCAST_BRANCH"
              appcast_base="$(git rev-parse FETCH_HEAD)"
              # The shell creates the redirect target before git runs, so a
              # failed `git show` leaves an empty appcast.xml behind --
              # and generate_appcast would then read that empty file as the
              # previous feed. It is removed, or the first release of the next
              # version would inherit a broken base.
              if git show "FETCH_HEAD:appcast.xml" > "$input/appcast.xml" 2>/dev/null; then
                echo "Previous appcast read from the $APPCAST_BRANCH branch; its entries were carried over (at most 3 per branch, see the note above)"
              else
                rm -f "$input/appcast.xml"
                echo "The $APPCAST_BRANCH branch has no appcast.xml yet; generating from scratch"
              fi
              ;;
            2)
              echo "The $APPCAST_BRANCH branch does not exist yet; generating from scratch (first release)"
              ;;
            *)
              echo "::error::git ls-remote failed with status $branch_state for $remote"
              echo "::error::This is not a first release. Refusing to regenerate the feed, because doing so would drop every historical entry."
              exit 1
              ;;
          esac

          # Written before the generator runs, so a release that produced a
          # feed without also producing its base is rejected by the asset
          # assertion below rather than shipped half-describable.
          printf '%s\n' "$appcast_base" > dist/appcast-base.txt
          echo "This appcast is based on $APPCAST_BRANCH commit '$appcast_base'"

          # The private key goes in on stdin and never in argv, matching the
          # convention the release signing step already uses.
          channel_args=()
          if [[ "$PRERELEASE" == "true" ]]; then
            # Both channels live in this one feed: a beta tag tags the new item,
            # a release tag leaves it untagged so it lands in the default channel
            # that Sparkle always allows. Nothing here creates a second feed.
            channel_args=(--channel beta)
          fi
          # --download-url-prefix applies to every archive in the input
          # directory, so older archives must NOT be put there. Measured on a
          # two-tag run:
          #
          #   prefix + only the new archive  -> 0.1.0 keeps its own v0.1.0 URL
          #                                      and its edSignature, 0.2.0 gets
          #                                      the current prefix. Correct.
          #   prefix + old archives too      -> 0.1.0's URL is rewritten to the
          #                                      v0.2.0 prefix, a 404.
          #
          # The cost is that no delta is generated: generate_appcast can only
          # build one when both archives are present, and they cannot both be
          # present without corrupting the old URL. Entries the previous appcast
          # carries are carried over unchanged (subject to the three-per-branch
          # limit noted above), so a user on an older version gets a correct full
          # download rather than a broken one.
          #
          # ADR 0011 decision 7 records this trade-off and the measurements
          # behind it. Rowan confirmed it on 2026-10-04; the delta upload below
          # is kept so that the assets an appcast can point at are never
          # missing, but it does not trigger under this input layout.
          printf '%s' "$PANESPACE_ED25519_PRIVATE_KEY" \
            | "$generator" --ed-key-file - \
                --download-url-prefix "https://github.com/$REPO/releases/download/$TAG/" \
                "${channel_args[@]}" \
                "$input"

          # generate_appcast writes into its input directory.
          cp "$input/appcast.xml" dist/appcast.xml

          # Real assertions, not a report: a mis-tagged feed is still a valid XML
          # file, so the exit status has to carry the verdict. The entry is
          # located by its own version, not by position -- see the script.
          python3 scripts/appcast-tool.py verify-appcast \
            dist/appcast.xml "$VERSION" "$PRERELEASE"

          # A delta, when one exists, is part of the release rather than a
          # by-product: the appcast points at it, so a client that finds one and
          # cannot download it fails the whole update. Copied, never moved, and
          # asserted below like every other asset.
          shopt -s nullglob
          deltas=("$input"/*.delta)
          if (( ${#deltas[@]} > 0 )); then
            cp "$input"/*.delta dist/
            echo "Publishing ${#deltas[@]} delta file(s): ${deltas[*]##*/}"
          else
            echo "No delta generated this run; see the note on --download-url-prefix above"
          fi

      - name: Assert every release asset is present
        run: |
          set -euo pipefail
          missing=()
          for asset in dist/appcast.xml dist/appcast-base.txt \
                       dist/PaneSpace-*-macos-arm64.zip \
                       dist/PaneSpace-*-macos-arm64.zip.sha256 \
                       dist/PaneSpace-*-macos-arm64.zip.sig; do
            # shellcheck disable=SC2086  # glob is intentional; quoting it would test a literal name
            ls $asset >/dev/null 2>&1 || missing+=("$asset")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing release asset(s): ${missing[*]}"
            echo "::error::Present in dist/: $(ls dist/)"
            exit 1
          fi
          ls -la dist/
          echo "All release assets present"

      - name: Delete the temporary keychain
        if: always()
        run: |
          set -uo pipefail
          # Fixed paths again, so cleanup works even if the import step failed
          # before it could record any output.
          rm -f "$RUNNER_TEMP/panespace-signing.p12" \
                "$RUNNER_TEMP/panespace-signing-cert.pem"
          if [[ -f "$RUNNER_TEMP/panespace-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/panespace-signing.keychain-db" || true
            echo "Temporary keychain removed"
          else
            echo "No temporary keychain to remove"
          fi

      - name: Upload release assets for publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panespace-release-assets
          path: |
            dist/PaneSpace-*-macos-arm64.zip
            dist/PaneSpace-*-macos-arm64.zip.sha256
            dist/PaneSpace-*-macos-arm64.zip.sig
            dist/appcast.xml
            dist/appcast-base.txt
          if-no-files-found: error
          retention-days: 1

  publish:
    # Separate job so the write token and the release assets are separated from
    # the secrets. This job never has access to the certificate or private key.
    runs-on: macos-26
    timeout-minutes: 15
    needs: build
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag, not the branch the workflow was selected on. This job verifies
          # the archive against the public key committed *at that tag* -- and
          # `gh release create` below is allowed to create a tag, so a checkout
          # that landed on some other branch would verify the release against the
          # wrong key. Same reason the build job follows the tag.
          ref: ${{ format('refs/tags/{0}', needs.build.outputs.tag) }}

      - name: Download release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: panespace-release-assets
          path: dist

      - name: Re-verify the archive signature before publishing
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          archive="dist/PaneSpace-$VERSION-macos-arm64.zip"
          for asset in "$archive" "$archive.sha256" "$archive.sig"; do
            if [[ ! -f "$asset" ]]; then
              echo "::error::Missing release asset $(basename "$asset")"
              exit 1
            fi
          done
          # The private key stays in the build job, so re-verify with the
          # committed public key that every installed copy trusts.
          swift scripts/ed25519.swift verify "$archive" \
            "$(cat "$archive.sig")" \
            "$(tr -d '[:space:]' < scripts/update-public-ed25519.txt)"
          (cd dist && shasum -a 256 -c "PaneSpace-$VERSION-macos-arm64.zip.sha256")

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          archive="PaneSpace-$VERSION-macos-arm64.zip"
          # appcast.xml rides along as a release asset on purpose. The job that
          # commits the feed runs in a different workflow run -- the human
          # publishing the release starts a new one -- and cannot reach this
          # run's artifact. The Release is the one object both runs can see, and
          # the file it carries is exactly the feed the build job signed.
          assets=("dist/$archive" "dist/$archive.sha256" "dist/$archive.sig" \
            "dist/appcast.xml" "dist/appcast-base.txt")
          # Deltas ride along when the build produced any. The appcast already
          # references them, so a release that shipped the feed without them
          # would hand every client a download URL that 404s.
          shopt -s nullglob
          for delta in dist/*.delta; do assets+=("$delta"); done
          if [[ ! -f dist/appcast.xml ]]; then
            echo "::error::dist/appcast.xml is missing; refusing to publish a release with no feed"
            exit 1
          fi
          # `gh release view` finds drafts as well as published releases, while
          # GET /releases/tags/{tag} returns published ones only. Without this,
          # re-running the workflow for the same tag would create a second,
          # duplicate draft. It exits 0 when the release exists and 1 when it does
          # not, so probe it and branch on that.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft >/dev/null 2>&1; then
            echo "Release for $TAG already exists (draft or published); appending assets"
            for asset in "${assets[@]}"; do
              gh release upload "$TAG" "$asset" --clobber
            done
          else
            prerelease_flag=()
            if [[ "$PRERELEASE" == "true" ]]; then
              prerelease_flag=(--prerelease)
            fi
            # Always created as a draft: Rowan publishes manually after checking
            # the notes, so a bad tag can never ship itself.
            gh release create "$TAG" "${assets[@]}" \
              --draft \
              --title "PaneSpace $VERSION" \
              --notes "PaneSpace $VERSION — macOS 26+, Apple silicon.

          Self-signed code signing; not notarised by Apple, so Gatekeeper asks
          once on first install. See docs/RELEASING.md." \
              "${prerelease_flag[@]}"
          fi
          echo "Release assets uploaded"

  # The feed is advanced only after the Release it points at is public.
  #
  # Every enclosure URL in an appcast is `releases/download/<tag>/…`, and a
  # draft's assets answer 404 to anyone who is not looking at that draft. So the
  # tag run must not commit the feed: from the moment the draft exists until a
  # human clicks Publish, every installed PaneSpace would be offered an update
  # it cannot download -- and if that draft is never published, the feed would
  # keep advertising a version nobody can ever fetch.
  #
  # `release: published` fires on the human click, which is exactly when the
  # assets become downloadable. Nothing about that is automatic: the Release
  # stays a draft until a person has read the notes, so a bad tag still cannot
  # ship itself.
  #
  # Same concurrency group as build/publish, for the same reason: `appcast` is
  # read-modify-write, and two releases landing at once would let the second
  # commit drop the first one's entry.
  publish-appcast:
    runs-on: macos-26
    timeout-minutes: 15
    # The inverse guard of the build job's: this half only runs for the
    # published release, never for a tag push.
    # The inverse guard of the build job's, plus the same manual recovery entry.
    # A dispatched run carries no `release` payload, so the tag comes from
    # `inputs.tag` instead; every step below reads RELEASE_TAG rather than the
    # payload directly, so there is exactly one place that knows which tag this
    # run is about. The release's flags are not taken from the payload at all --
    # they are read from the server -- so both triggers behave identically.
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.job == 'publish-appcast')
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out the published tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag, not the default branch. The feed about to be committed was
          # generated by this tag's own scripts from this tag's own release
          # asset, so it is that tag's scripts that have to check it.
          #
          # `refs/tags/` is spelled out for the reason given in the build job's
          # checkout: a bare name also resolves to a branch of the same name, and
          # this job then commits the feed. Resolving to a branch here would
          # verify one ref's scripts and publish another's result.
          ref: ${{ format('refs/tags/{0}', env.RELEASE_TAG) }}

      - name: Derive version from the published tag
        id: version
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          read -r version build_number < <(./scripts/version-from-tag.sh "$TAG")
          {
            echo "version=$version"
            echo "build=$build_number"
          } >> "$GITHUB_OUTPUT"
          echo "Advancing the feed for $version (build $build_number) from tag $TAG"

      - name: Read the release's published state from the server
        id: release_state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
          DRAFT: ${{ github.event.release.draft }}
        run: |
          set -euo pipefail
          # One question, one answer, from the server: what does GitHub currently
          # say this Release is? Both flags come back in one call, because reading
          # them from two places is how they end up disagreeing.
          #
          # The payload is used as a cheap pre-filter only. A manually dispatched
          # run carries no `release` payload at all, so DRAFT is empty and this
          # branch cannot fire there -- which is exactly why the flag that matters
          # below cannot come from the payload either.
          if [[ "$DRAFT" == "true" ]]; then
            echo "::error::The release event for $TAG says the release is still a draft; the feed stays where it is"
            exit 1
          fi
          state="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease --template '{{.isDraft}} {{.isPrerelease}}')"
          read -r draft prerelease <<<"$state"
          if [[ "$draft" != "false" ]]; then
            echo "::error::GitHub reports $TAG as isDraft=$draft; the feed stays where it is"
            exit 1
          fi
          # The prerelease flag used to be read from the event payload. On a
          # manually dispatched run that payload does not exist, so the flag came
          # back empty and `verify-appcast` saw a beta tag with no channel --
          # refusing to publish the one feed this recovery entry exists for --
          # while for a stable tag the check it was written to perform was simply
          # skipped, leaving a flag flipped on the draft before publishing
          # undetected. Reading it here covers both triggers with one path.
          if [[ "$prerelease" != "true" && "$prerelease" != "false" ]]; then
            echo "::error::GitHub reported isPrerelease='$prerelease' for $TAG, which is neither true nor false; refusing to guess"
            exit 1
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "GitHub reports $TAG as published, isPrerelease=$prerelease"

      - name: Download the appcast and the commit it was built on
        id: download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # appcast* is appcast.xml plus appcast-base.txt, the two files the
          # publish job put on the Release. `gh release download` takes one
          # pattern, and matching them together is cheaper than two calls.
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'appcast*' --dir dist; then
            echo "::error::$TAG carries no appcast assets, so this Release was not built by release.yml"
            echo "::error::The feed stays where it is rather than advertising a release it cannot vouch for."
            exit 1
          fi
          if [[ ! -s dist/appcast.xml ]]; then
            echo "::error::$TAG carries an empty appcast.xml; refusing to publish it"
            exit 1
          fi
          if [[ ! -s dist/appcast-base.txt ]]; then
            echo "::error::$TAG carries no appcast-base.txt, so the feed cannot be checked against the branch it was built on"
            echo "::error::Re-run this tag's build in Actions to regenerate both assets, then re-run this job."
            exit 1
          fi
          base="$(tr -d '[:space:]' < dist/appcast-base.txt)"
          if [[ "$base" != "none" && ! "$base" =~ ^[0-9a-f]{40}$ \
            && ! "$base" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::appcast-base.txt holds '$base', which is neither 'none' nor a commit SHA"
            exit 1
          fi
          echo "appcast-base=$base" >> "$GITHUB_OUTPUT"
          echo "This appcast was built on '$base'"

      - name: Assert the downloaded feed is this release's feed
        env:
          TAG: ${{ env.RELEASE_TAG }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.release_state.outputs.prerelease }}
        run: |
          set -euo pipefail
          # The same assertions the build job ran, re-run on the file as it
          # actually arrived: it came over the API, not out of this workflow's
          # own workspace. A prerelease flag changed on the draft before
          # publishing is caught here rather than by stable users -- and the
          # flag it is checked against is the server's, read above, not the one
          # the triggering event happened to carry.
          python3 scripts/appcast-tool.py verify-appcast \
            dist/appcast.xml "$VERSION" "$PRERELEASE"

      - name: Assert every advertised download is live
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          # The regression this job exists for, checked rather than assumed.
          # Every URL the new feed advertises under this tag has to resolve for
          # an anonymous client, right now. curl follows the redirect to the
          # asset store and is given no credentials, so this is the same view a
          # user has -- the view that used to 404 while the Release was a draft.
          grep -o "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/[^\"]*" \
            dist/appcast.xml > dist/advertised-urls.txt || true
          if [[ ! -s dist/advertised-urls.txt ]]; then
            echo "::error::The feed advertises no URL under releases/download/$TAG; refusing to publish it"
            echo "::error::If the download prefix changed, update this check rather than deleting it."
            exit 1
          fi
          while IFS= read -r url; do
            [[ -n "$url" ]] || continue
            if ! status="$(curl -sSL --retry 3 --retry-delay 2 \
              -o /dev/null -w '%{http_code}' "$url")"; then
              echo "::error::Could not reach $url"
              exit 1
            fi
            if [[ "$status" != "200" ]]; then
              echo "::error::$url answered HTTP $status; publishing this feed would hand every client a broken download"
              exit 1
            fi
            echo "200 $url"
          done < dist/advertised-urls.txt

      - name: Commit the appcast to the appcast branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
          VERSION: ${{ steps.version.outputs.version }}
          APPCAST_BRANCH: appcast
          BASE: ${{ steps.download.outputs.appcast-base }}
        run: |
          set -euo pipefail
          # Reached only after every assertion above passed: the Release is
          # public, every download it advertises answers 200, and the feed was
          # built on the branch's current head. That last one is what makes
          # committing the snapshot safe -- and it is why this step lives in the
          # published event rather than in the tag push.
          remote="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"

          # The `appcast` branch is an orphan: the feed has no shared history
          # with the source tree, and each release is one commit, which is the
          # audit trail the branch was chosen for.
          #
          # GitHub-hosted runners have no global user.name/user.email, so a bare
          # `git commit` fails with "Please tell me who you are". The identity
          # is passed per-command rather than written to any config, so it
          # cannot leak into another step or another repository.
          git_author() {
            git -c user.name=github-actions[bot] \
                -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
                "$@"
          }

          # Same three-way distinction as the build job: 0 = the branch exists,
          # 2 = first release, anything else = the remote could not be reached.
          # Treating a network or auth failure as "no branch" would create the
          # branch from scratch and lose every published entry.
          branch_state=0
          git ls-remote --exit-code --heads "$remote" "$APPCAST_BRANCH" >/dev/null 2>&1 || branch_state=$?
          case "$branch_state" in
            0)
              git fetch --depth 1 "$remote" "$APPCAST_BRANCH"
              # This snapshot was generated on top of one specific commit of
              # this branch. If the branch has moved since -- and with the
              # release sitting as a draft for a day, it very well has -- then
              # committing the snapshot would drop every entry added in
              # between, which is how a published 0.2.1 vanishes from the feed
              # because a beta tagged earlier was released later.
              #
              # The fast-forward push below only covers the seconds between this
              # fetch and that push. It cannot tell that the snapshot was taken
              # hours ago; only this comparison can.
              current="$(git rev-parse FETCH_HEAD)"
              if [[ "$current" != "$BASE" ]]; then
                echo "::error::$APPCAST_BRANCH is now at $current, but this appcast was built on '$BASE'."
                echo "::error::Publishing it would delete every entry added in between."
                echo "::error::Re-run this tag's build in Actions -- it regenerates the appcast on top of the current head -- then re-run this job."
                exit 1
              fi
              # The new commit's parent is the commit just fetched, so the push
              # below is a fast-forward and needs no --force. That is also the
              # safety property: if anything else wrote to this branch since
              # the fetch, the push is rejected instead of overwriting it.
              git checkout -B "$APPCAST_BRANCH" FETCH_HEAD
              ;;
            2)
              if [[ "$BASE" != "none" ]]; then
                echo "::error::The $APPCAST_BRANCH branch does not exist, but this appcast was built on '$BASE'."
                echo "::error::Re-run this tag's build in Actions, then re-run this job."
                exit 1
              fi
              git checkout --orphan "$APPCAST_BRANCH"
              # Everything checked out from the tag has to leave the index, or
              # the feed branch would carry the whole source tree.
              git rm -rf --cached . >/dev/null 2>&1 || true
              ;;
            *)
              echo "::error::git ls-remote failed with status $branch_state for the appcast branch"
              echo "::error::Refusing to publish: this would silently replace the published feed."
              exit 1
              ;;
          esac

          cp dist/appcast.xml appcast.xml
          git add appcast.xml
          if git diff --cached --quiet; then
            echo "appcast.xml is unchanged; nothing to publish"
            exit 0
          fi
          git_author commit -m "appcast: $VERSION ($TAG)"
          git push "$remote" "HEAD:refs/heads/$APPCAST_BRANCH"
          echo "Published appcast to $APPCAST_BRANCH"
          echo "Feed URL: https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$APPCAST_BRANCH/appcast.xml"
